<!DOCTYPE html>

<head>

    <title>Directorio Médico - Centro Médico Loira</title>
    
    <link rel="icon" type="image/svg+xml" href="imagenes/Logo Loira.svg">
    
    <link rel="stylesheet" href="css/stilos.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">
                <img src="imagenes/Logo Loira.svg" alt="Logo Centro Médico Loira" class="nav-logo">
            </a>
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
            <i class="fas fa-bars"></i>

        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>

                <li><a href="#contacto">Contacto</a></li>

    <main>
        <section class="search-section">
            <div class="search-content">
                <h1>Directorio Médico</h1>
                <p>Encuentra al especialista que necesitas de forma rápida.</p>
                
                <div class="search-container">
                    <div class="select-wrapper">
                        <i class="fas fa-stethoscope"></i>
                        <select id="specialtySelect">
                            <option value="">-- Seleccionar Especialidad --</option>
                        </select>
                    </div>
                    <button class="btn-search" id="btnSearch">
                        <i class="fas fa-search"></i> BUSCAR
                    </button>
                </div>
            </div>
        </section>

        <div class="results-container" id="results">
            <div class="no-results">
                <i class="fas fa-user-md"></i>
                <p>Selecciona una especialidad para ver nuestro equipo médico.</p>
            </div>
        </div>

    <script src="script.js"></script>
